<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Stremio Signature Electric Violet Gradient -->
    <linearGradient id="stremioPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#9d4edd"/>
      <stop offset="50%" stop-color="#8338ec"/>
      <stop offset="100%" stop-color="#5a189a"/>
    </linearGradient>

    <!-- Subtle Ambient Radial Glow on Dark Background -->
    <radialGradient id="canvasGlow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#3c106e" stop-opacity="0.45"/>
      <stop offset="70%" stop-color="#160829" stop-opacity="0.2"/>
      <stop offset="100%" stop-color="#0b0514" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadow for Controller Float -->
    <filter id="controllerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="20" flood-color="#000000" flood-opacity="0.75"/>
      <feDropShadow dx="0" dy="4" stdDeviation="10" flood-color="#7c3aed" flood-opacity="0.3"/>
    </filter>

    <filter id="playGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- APP ICON SQUIRCLE CANVAS (MODERN APP BADGE)    -->
  <!-- ============================================== -->
  <rect width="512" height="512" rx="116" fill="#0e071a"/>
  <rect width="512" height="512" rx="116" fill="url(#canvasGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#2a1247" stroke-width="2"/>

  <!-- ============================================== -->
  <!-- MINIMALIST CONSOLE GAMEPAD SILHOUETTE          -->
  <!-- ============================================== -->
  <g filter="url(#controllerShadow)">
    <path d="M 168 136
             C 204 136, 230 154, 256 154
             C 282 154, 308 136, 344 136
             C 404 136, 456 186, 464 254
             C 474 326, 442 400, 380 418
             C 336 430, 302 386, 286 354
             C 272 326, 240 326, 226 354
             C 210 386, 176 430, 132 418
             C 70 400, 38 326, 48 254
             C 56 186, 108 136, 168 136 Z"
          fill="url(#stremioPurple)"/>
  </g>

  <!-- ============================================== -->
  <!-- CENTER: STREMIO PLAY BUTTON (CLEAN WHITE)      -->
  <!-- ============================================== -->
  <path d="M 235 204
           C 235 192, 247 185, 258 191
           L 308 221
           C 318 227, 318 243, 308 249
           L 258 279
           C 247 285, 235 278, 235 266 Z"
        fill="#ffffff"
        filter="url(#playGlow)"/>

  <!-- ============================================== -->
  <!-- LEFT: MINIMALIST CONSOLE D-PAD (SOLID WHITE)   -->
  <!-- ============================================== -->
  <g fill="#ffffff">
    <rect x="134" y="214" width="16" height="52" rx="6"/>
    <rect x="116" y="232" width="52" height="16" rx="6"/>
  </g>

  <!-- ============================================== -->
  <!-- RIGHT: 4 CONSOLE ACTION BUTTONS (PLAYSTATION / -->
  <!-- XBOX COLORS IN PURE MINIMALIST FORM)           -->
  <!-- ============================================== -->
  <g>
    <!-- North: Triangle ▲ (Green) -->
    <circle cx="376" cy="214" r="8" fill="#4ade80"/>
    <!-- East: Circle ◯ (Red) -->
    <circle cx="402" cy="240" r="8" fill="#f87171"/>
    <!-- South: Cross ✕ (Cyan / Blue) -->
    <circle cx="376" cy="266" r="8" fill="#38bdf8"/>
    <!-- West: Square ▢ (Pink / Violet) -->
    <circle cx="350" cy="240" r="8" fill="#f472b6"/>
  </g>
</svg>