name: Release
on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: Existing release tag to build
        required: true
        default: v0.1.5
permissions:
  contents: write
concurrency:
  group: release-${{ inputs.version || github.ref_name }}
  cancel-in-progress: false
jobs:
  release:
    runs-on: windows-latest
    env:
      RELEASE_TAG: ${{ inputs.version || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.version || github.ref_name }}
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc
      - uses: swatinem/rust-cache@v2
        with:
          workspaces: './src-tauri -> target'
      - name: Restore packaged streaming runtime
        shell: pwsh
        run: |
          gh release download $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --pattern runtime-windows-x64.zip --dir .
          if ($LASTEXITCODE -ne 0) { throw 'Runtime download failed' }
          Expand-Archive runtime-windows-x64.zip -DestinationPath . -Force
          foreach ($path in @('bin/server/stremio-runtime.exe', 'bin/server/ffmpeg.exe', 'bin/server/ffprobe.exe', 'release/WebView2Loader.dll')) {
            if (!(Test-Path $path)) { throw "Missing bundled resource: $path" }
          }
      - run: npm ci
      - name: Verify application
        run: |
          npm run test:steam
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:input
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:streams
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          npm run test:playback
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          cargo test --manifest-path src-tauri/Cargo.toml --lib
      - name: Build installers
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ env.RELEASE_TAG }}
          releaseName: Steam for Consoles ${{ env.RELEASE_TAG }}
          releaseDraft: true
          prerelease: false
      - name: Package portable application and publish
        shell: pwsh
        run: |
          New-Item -ItemType Directory portable/bin -Force | Out-Null
          Copy-Item src-tauri/target/release/app.exe portable/Steam_for_Consoles.exe
          Copy-Item release/WebView2Loader.dll portable/
          Copy-Item bin/server portable/bin/server -Recurse
          Copy-Item THIRD_PARTY_NOTICES.md portable/
          Compress-Archive portable/* "Steam_for_Consoles_$($env:RELEASE_TAG)_windows-x64.zip"
          gh release upload $env:RELEASE_TAG "Steam_for_Consoles_$($env:RELEASE_TAG)_windows-x64.zip" --repo $env:GITHUB_REPOSITORY --clobber
          if ($LASTEXITCODE -ne 0) { throw 'Portable upload failed' }
          gh release edit $env:RELEASE_TAG --repo $env:GITHUB_REPOSITORY --draft=false --latest
          if ($LASTEXITCODE -ne 0) { throw 'Release publication failed' }
