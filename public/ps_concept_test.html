<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #090611;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
    }
    svg {
      width: 280px;
      height: 280px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- VARIATION 1: PS CLASSIC PERSPECTIVE TRIBUTE    -->
  <!-- Upright S standing tall, Flat Diamond + Play on floor -->
  <!-- ============================================== -->
  <div class="box">
    <span>Variação 1: Pure PS Isometric Geometry</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Stremio Electric Purple Gradients -->
        <linearGradient id="uprightSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#b774ff"/>
          <stop offset="50%" stop-color="#8b35ff"/>
          <stop offset="100%" stop-color="#6911db"/>
        </linearGradient>

        <!-- Floor Diamond (Shadow/Base) Gradient - PS style multi-stripes or sleek neon -->
        <linearGradient id="floorDiamondGrad" x1="0%" y1="50%" x2="100%" y2="50%">
          <stop offset="0%" stop-color="#00f2fe"/>
          <stop offset="35%" stop-color="#38bdf8"/>
          <stop offset="70%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>

        <linearGradient id="floorDiamondPure" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#4c1d95"/>
        </linearGradient>

        <!-- Shadow filter -->
        <filter id="psShadow" x="-30%" y="-30%" width="160%" height="160%">
          <feDropShadow dx="0" dy="12" stdDeviation="16" flood-color="#000000" flood-opacity="0.8"/>
          <feDropShadow dx="0" dy="2" stdDeviation="6" flood-color="#7c3aed" flood-opacity="0.3"/>
        </filter>
      </defs>

      <!-- Dark Squircle Canvas -->
      <rect width="512" height="512" rx="116" fill="#0d0718"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#2a1247" stroke-width="2"/>

      <g filter="url(#psShadow)">
        <!-- ============================================== -->
        <!-- FLOOR PLANE: THE STREMIO DIAMOND AS THE SHADOW -->
        <!-- Projected in 3D perspective lying on the ground -->
        <!-- In the PS logo, the floor 'S' spans across the bottom -->
        <!-- Here: The Diamond (rhombus) lies flat in isometric space -->
        <!-- ============================================== -->
        
        <!-- Floor Diamond Outer Shell -->
        <!-- Points: Top-Back(256, 290), Right(440, 350), Bottom-Front(270, 425), Left(110, 360) -->
        <path d="M 230 295
                 C 240 290, 256 290, 268 296
                 L 432 355
                 C 445 360, 442 372, 428 378
                 L 282 435
                 C 268 440, 252 440, 240 434
                 L 98 375
                 C 86 370, 88 358, 102 352 Z"
              fill="url(#floorDiamondGrad)"/>

        <!-- Floor Diamond Inner Cut / Inset -->
        <path d="M 234 308
                 C 242 304, 254 304, 264 309
                 L 404 358
                 C 414 362, 412 370, 402 374
                 L 278 420
                 C 268 424, 256 424, 246 419
                 L 126 374
                 C 116 370, 118 362, 128 358 Z"
              fill="#120822"/>

        <!-- PLAY TRIANGLE PROJECTED ON THE FLOOR (IN PERSPECTIVE) -->
        <!-- Pointing towards the right / front in 3D -->
        <path d="M 216 345
                 C 216 339, 224 336, 232 339
                 L 310 366
                 C 318 369, 318 378, 310 381
                 L 242 404
                 C 234 407, 222 403, 222 396 Z"
              fill="#ffffff"/>

        <!-- ============================================== -->
        <!-- UPRIGHT STANDING 'S' (IN THE STYLE OF THE PS 'P')-->
        <!-- Stands vertically, cutting through the floor plane -->
        <!-- ============================================== -->
        
        <!-- Extruded 3D Left Edge of S (Depth facet) -->
        <path d="M 194 98
                 C 152 98, 138 128, 138 156
                 L 150 156
                 C 150 134, 160 110, 194 110
                 L 194 98 Z"
              fill="#520ea8"/>

        <!-- Master Upright 'S' Body -->
        <!-- Elegant, geometric, bold letter S standing proud -->
        <path d="M 276 96
                 C 204 96, 172 136, 172 178
                 C 172 232, 230 248, 254 260
                 C 288 276, 302 296, 302 324
                 C 302 360, 268 392, 206 392
                 C 160 392, 130 368, 120 348
                 L 120 380
                 C 142 402, 180 416, 220 416
                 C 298 416, 338 374, 338 322
                 C 338 266, 282 248, 254 236
                 C 220 220, 206 202, 206 176
                 C 206 142, 234 118, 274 118
                 C 310 118, 334 136, 346 154
                 L 346 122
                 C 328 106, 302 96, 276 96 Z"
              fill="url(#uprightSGrad)"/>

        <!-- Inner Bevel Highlight on S to give it PS tactile presence -->
        <path d="M 274 118
                 C 234 118, 206 142, 206 176
                 C 206 202, 220 220, 254 236"
              fill="none" stroke="#ffffff" stroke-width="3" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- ============================================== -->
  <!-- VARIATION 2: THE DIRECT PS LOGO ARCHITECTURE   -->
  <!-- Exactly like the PS logo: S stands up, and its -->
  <!-- shadow on the ground is the Stremio Diamond+Play -->
  <!-- ============================================== -->
  <div class="box">
    <span>Variação 2: Stremio Diamond Cast Floor</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="uprightGrad2" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#b066ff"/>
          <stop offset="100%" stop-color="#7928ca"/>
        </linearGradient>

        <linearGradient id="floorGrad2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00f2fe"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#f43f5e"/>
        </linearGradient>
      </defs>

      <rect width="512" height="512" rx="116" fill="#0d0718"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#2a1247" stroke-width="2"/>

      <g filter="url(#psShadow)">
        <!-- 3D Perspective Grid Rays (Subtle PS Retro Vibe) -->
        <g stroke="#3b1d66" stroke-width="1.5" opacity="0.4">
          <line x1="160" y1="310" x2="60" y2="440"/>
          <line x1="256" y1="310" x2="220" y2="460"/>
          <line x1="352" y1="310" x2="420" y2="440"/>
        </g>

        <!-- FLOOR SHADOW: Stremio Losango with Play in 3D Floor Projection -->
        <!-- Diamond lying flat, anchoring the bottom -->
        <g transform="translate(256, 380) scale(1, 0.45) rotate(45)">
          <!-- Ground Diamond Base -->
          <rect x="-120" y="-120" width="240" height="240" rx="45" fill="url(#floorGrad2)"/>
          <rect x="-105" y="-105" width="210" height="210" rx="38" fill="#110722"/>

          <!-- Play Triangle on the Ground -->
          <path d="M -30 -50
                   C -30 -60, -18 -66, -10 -60
                   L 55 -15
                   C 65 -8, 65 8, 55 15
                   L -10 60
                   C -18 66, -30 60, -30 50 Z"
                fill="#ffffff"/>
        </g>

        <!-- UPRIGHT STANDING 'S' (PlayStation Vertical Structure) -->
        <path d="M 270 80
                 C 200 80, 168 120, 168 162
                 C 168 214, 222 232, 250 244
                 C 286 260, 304 278, 304 310
                 C 304 350, 268 380, 206 380
                 C 160 380, 128 356, 116 332
                 L 116 370
                 C 138 394, 176 408, 218 408
                 C 298 408, 342 364, 342 308
                 C 342 250, 284 232, 252 218
                 C 216 202, 204 186, 204 158
                 C 204 126, 232 104, 272 104
                 C 308 104, 334 122, 346 142
                 L 346 106
                 C 328 90, 300 80, 270 80 Z"
              fill="url(#uprightGrad2)"/>
      </g>
    </svg>
  </div>

  <!-- ============================================== -->
  <!-- VARIATION 3: THE TRUE INTERLOCKING S + SHADOW  -->
  <!-- Like the PS 'P' and 'S' interlock, the 'S' and -->
  <!-- Diamond Play button interlock seamlessly       -->
  <!-- ============================================== -->
  <div class="box">
    <span>Variação 3: Interlocking PS Architecture</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- The classic PS-style multi-color gradient adapted for Stremio Gaming -->
        <linearGradient id="psSGrad" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c084fc"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6b21a8"/>
        </linearGradient>

        <linearGradient id="shadowDiamondGrad" x1="0%" y1="0%" x2="100%" y2="100%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
      </defs>

      <rect width="512" height="512" rx="116" fill="#0c0617"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#25123d" stroke-width="2"/>

      <g filter="url(#psShadow)">
        <!-- PERSPECTIVE FLOOR SHADOW (STREMIO DIAMOND + PLAY) -->
        <!-- Exactly in the 3D ground projection of the PlayStation S-shadow -->
        <g transform="translate(256, 375) scale(1.1, 0.42) rotate(45)">
          <!-- Outer Shadow Diamond -->
          <rect x="-115" y="-115" width="230" height="230" rx="42" fill="url(#shadowDiamondGrad)" opacity="0.95"/>
          <rect x="-98" y="-98" width="196" height="196" rx="34" fill="#0c0617"/>
          
          <!-- Inner Play Triangle -->
          <polygon points="-25,-45 50,0 -25,45" fill="#ffffff"/>
        </g>

        <!-- UPRIGHT 'S' STANDING TALL AND PROUD -->
        <!-- Clean, bold geometric letter S with 3D left facet depth -->
        <!-- 3D Bevel/Depth on the left side of S (like the red P in PS) -->
        <path d="M 166 166 L 152 176 L 152 230 L 166 220 Z" fill="#4a0e99"/>
        <path d="M 198 382 L 184 394 L 184 410 L 202 400 Z" fill="#4a0e99"/>

        <!-- Upright Main Face of S -->
        <path d="M 272 84
                 C 204 84, 170 124, 170 166
                 C 170 218, 224 236, 252 248
                 C 288 264, 306 282, 306 314
                 C 306 354, 270 384, 208 384
                 C 162 384, 130 360, 118 336
                 L 118 374
                 C 140 398, 178 412, 220 412
                 C 300 412, 344 368, 344 312
                 C 344 254, 286 236, 254 222
                 C 218 206, 206 190, 206 162
                 C 206 130, 234 108, 274 108
                 C 310 108, 336 126, 348 146
                 L 348 110
                 C 330 94, 302 84, 272 84 Z"
              fill="url(#psSGrad)"/>

        <!-- Crisp Top Highlight on the S -->
        <path d="M 272 108 C 234 108, 206 130, 206 162 C 206 186, 216 202, 246 216"
              fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.6"/>
      </g>
    </svg>
  </div>

</body>
</html>
