<!DOCTYPE html>
<html>
<head>
  <style>
    body {
      margin: 0;
      padding: 30px;
      background: #090611;
      display: flex;
      gap: 30px;
      justify-content: center;
      align-items: center;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    .box {
      display: flex;
      flex-direction: column;
      align-items: center;
      color: #e2e8f0;
      font-size: 14px;
      font-weight: 500;
    }
    svg {
      width: 290px;
      height: 290px;
      margin-top: 12px;
    }
  </style>
</head>
<body>

  <!-- ============================================== -->
  <!-- CONCEPT A: BOLD GEOMETRIC CHUNKY 'S' + DIAMOND -->
  <!-- Authentic PlayStation geometric weight & feel -->
  <!-- ============================================== -->
  <div class="box">
    <span>Design A: Bold PS Architectural 'S'</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <!-- Stremio Vivid Purple (Upright S) -->
        <linearGradient id="sFrontGradA" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#bd7aff"/>
          <stop offset="50%" stop-color="#8b35ff"/>
          <stop offset="100%" stop-color="#6911db"/>
        </linearGradient>

        <!-- 3D Extrusion Side Depth of S -->
        <linearGradient id="sSideGradA" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#5512a8"/>
          <stop offset="100%" stop-color="#300566"/>
        </linearGradient>

        <!-- Floor Diamond (Stremio Losango in Perspective) -->
        <linearGradient id="floorDiamondGradA" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00f2fe"/>
          <stop offset="35%" stop-color="#38bdf8"/>
          <stop offset="70%" stop-color="#a855f7"/>
          <stop offset="100%" stop-color="#ec4899"/>
        </linearGradient>

        <filter id="psGlowA" x="-25%" y="-25%" width="150%" height="150%">
          <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#000000" flood-opacity="0.85"/>
          <feDropShadow dx="0" dy="4" stdDeviation="8" flood-color="#7c3aed" flood-opacity="0.35"/>
        </filter>
      </defs>

      <!-- App Canvas Squircle -->
      <rect width="512" height="512" rx="116" fill="#0d0718"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#25123d" stroke-width="2"/>

      <g filter="url(#psGlowA)">
        <!-- ========================================== -->
        <!-- FLOOR SHADOW: STREMIO DIAMOND + PLAY       -->
        <!-- Flat in 3D isometric perspective           -->
        <!-- ========================================== -->
        <g transform="translate(265, 368) scale(1.05, 0.44) rotate(45)">
          <!-- Outer Losango Base -->
          <rect x="-125" y="-125" width="250" height="250" rx="46" fill="url(#floorDiamondGradA)"/>
          <rect x="-105" y="-105" width="210" height="210" rx="36" fill="#0d0718"/>

          <!-- Play Triangle in Floor Plane -->
          <path d="M -32 -54
                   C -32 -65, -18 -72, -9 -65
                   L 65 -15
                   C 76 -7, 76 7, 65 15
                   L -9 65
                   C -18 72, -32 65, -32 54 Z"
                fill="#ffffff"/>
        </g>

        <!-- ========================================== -->
        <!-- UPRIGHT STANDING 'S' (PLAYSTATION STYLE)   -->
        <!-- Bold, solid geometric silhouette with 3D   -->
        <!-- ========================================== -->

        <!-- 3D Depth Extrusion Faces (Left side facets) -->
        <!-- Top loop left depth -->
        <path d="M 188 126 C 172 142, 164 162, 164 186 L 148 198 C 148 168, 158 144, 178 122 Z" fill="url(#sSideGradA)"/>
        <!-- Spine depth -->
        <path d="M 164 186 L 164 220 L 148 232 L 148 198 Z" fill="url(#sSideGradA)"/>
        <!-- Bottom left depth -->
        <path d="M 168 334 C 152 352, 144 372, 144 394 L 128 406 C 128 376, 138 350, 156 328 Z" fill="url(#sSideGradA)"/>

        <!-- Main Upright S Body -->
        <path d="M 326 94
                 L 326 142
                 C 304 126, 274 116, 244 116
                 C 202 116, 180 138, 180 168
                 C 180 196, 198 214, 242 228
                 L 266 236
                 C 328 256, 356 288, 356 334
                 C 356 394, 308 428, 234 428
                 C 188 428, 148 410, 126 388
                 L 134 336
                 C 160 362, 196 376, 236 376
                 C 278 376, 302 356, 302 328
                 C 302 300, 284 282, 240 268
                 L 216 260
                 C 158 240, 130 208, 130 162
                 C 130 108, 178 72, 252 72
                 C 288 72, 320 82, 342 96 Z"
              fill="url(#sFrontGradA)"/>

        <!-- Clean Top Highlight on the S -->
        <path d="M 252 82 C 282 82, 310 92, 326 104"
              fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- ============================================== -->
  <!-- CONCEPT B: INTERLOCKING EMBLEM                 -->
  <!-- The S wraps seamlessly through the Diamond     -->
  <!-- ============================================== -->
  <div class="box">
    <span>Design B: Smooth Fluid S + Play Shadow</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sFrontGradB" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#c084fc"/>
          <stop offset="50%" stop-color="#9333ea"/>
          <stop offset="100%" stop-color="#6b21a8"/>
        </linearGradient>

        <linearGradient id="floorGradB" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#38bdf8"/>
          <stop offset="50%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#c084fc"/>
        </linearGradient>
      </defs>

      <rect width="512" height="512" rx="116" fill="#0d0718"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#25123d" stroke-width="2"/>

      <g filter="url(#psGlowA)">
        <!-- Floor Diamond Shadow -->
        <g transform="translate(270, 360) scale(1.15, 0.42) rotate(45)">
          <rect x="-115" y="-115" width="230" height="230" rx="42" fill="url(#floorGradB)"/>
          <rect x="-95" y="-95" width="190" height="190" rx="32" fill="#0d0718"/>

          <!-- Play Triangle on the floor -->
          <polygon points="-28,-50 55,0 -28,50" fill="#ffffff"/>
        </g>

        <!-- Upright S standing tall like PS 'P' -->
        <!-- 3D Bevel Edge -->
        <path d="M 170 150 L 152 165 L 152 225 L 170 210 Z" fill="#4c1d95"/>
        <path d="M 190 355 L 174 370 L 174 400 L 194 388 Z" fill="#4c1d95"/>

        <!-- Front S -->
        <path d="M 284 80
                 C 210 80, 172 122, 172 168
                 C 172 222, 230 240, 260 252
                 C 298 268, 318 288, 318 322
                 C 318 364, 280 396, 214 396
                 C 168 396, 132 370, 118 344
                 L 118 386
                 C 142 412, 184 428, 228 428
                 C 312 428, 360 380, 360 320
                 C 360 258, 298 238, 264 224
                 C 226 208, 212 190, 212 160
                 C 212 126, 242 104, 286 104
                 C 324 104, 352 124, 364 146
                 L 364 106
                 C 344 88, 316 80, 284 80 Z"
              fill="url(#sFrontGradB)"/>

        <!-- Gloss trace -->
        <path d="M 284 104 C 242 104, 212 126, 212 160 C 212 184, 222 200, 252 216"
              fill="none" stroke="#ffffff" stroke-width="3" stroke-linecap="round" opacity="0.6"/>
      </g>
    </svg>
  </div>

  <!-- ============================================== -->
  <!-- CONCEPT C: ICONIC MONOLINE PS PERSPECTIVE      -->
  <!-- Striped multi-tone floor shadow like original  -->
  <!-- PS logo stripes (cyan, purple, red)            -->
  <!-- ============================================== -->
  <div class="box">
    <span>Design C: Multi-Tone PS Bands + S</span>
    <svg viewBox="0 0 512 512" xmlns="http://www.w3.org/2000/svg">
      <defs>
        <linearGradient id="sFrontGradC" x1="0%" y1="0%" x2="0%" y2="100%">
          <stop offset="0%" stop-color="#bd7aff"/>
          <stop offset="60%" stop-color="#8b35ff"/>
          <stop offset="100%" stop-color="#6010cc"/>
        </linearGradient>

        <linearGradient id="band1" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#00f2fe"/>
          <stop offset="100%" stop-color="#38bdf8"/>
        </linearGradient>
        <linearGradient id="band2" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#818cf8"/>
          <stop offset="100%" stop-color="#a855f7"/>
        </linearGradient>
        <linearGradient id="band3" x1="0%" y1="0%" x2="100%" y2="0%">
          <stop offset="0%" stop-color="#f43f5e"/>
          <stop offset="100%" stop-color="#fb7185"/>
        </linearGradient>
      </defs>

      <rect width="512" height="512" rx="116" fill="#0d0718"/>
      <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#25123d" stroke-width="2"/>

      <g filter="url(#psGlowA)">
        <!-- 3-Band Perspective Floor Diamond (Exact PS Spirit: Multi-Color Shadow) -->
        <g transform="translate(265, 365) scale(1.12, 0.43) rotate(45)">
          <!-- Top band: Cyan -->
          <path d="M -120 -120 L 0 -120 L 0 0 L -120 0 Z" fill="url(#band1)" rx="10"/>
          <!-- Middle/Right band: Purple -->
          <path d="M 0 -120 L 120 -120 L 120 120 L 0 120 Z" fill="url(#band2)" rx="10"/>
          <!-- Bottom/Left band: Magenta -->
          <path d="M -120 0 L 0 0 L 0 120 L -120 120 Z" fill="url(#band3)" rx="10"/>

          <!-- Dark Inset Diamond Core -->
          <rect x="-95" y="-95" width="190" height="190" rx="30" fill="#0d0718"/>

          <!-- Solid White Play Triangle -->
          <polygon points="-28,-50 55,0 -28,50" fill="#ffffff"/>
        </g>

        <!-- Upright S -->
        <path d="M 284 80
                 C 210 80, 172 122, 172 168
                 C 172 222, 230 240, 260 252
                 C 298 268, 318 288, 318 322
                 C 318 364, 280 396, 214 396
                 C 168 396, 132 370, 118 344
                 L 118 386
                 C 142 412, 184 428, 228 428
                 C 312 428, 360 380, 360 320
                 C 360 258, 298 238, 264 224
                 C 226 208, 212 190, 212 160
                 C 212 126, 242 104, 286 104
                 C 324 104, 352 124, 364 146
                 L 364 106
                 C 344 88, 316 80, 284 80 Z"
              fill="url(#sFrontGradC)"/>

        <!-- Top Highlight -->
        <path d="M 284 104 C 242 104, 212 126, 212 160"
              fill="none" stroke="#ffffff" stroke-width="3.5" stroke-linecap="round" opacity="0.7"/>
      </g>
    </svg>
  </div>

</body>
</html>
