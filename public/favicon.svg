<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <!-- Stremio Vivid Electric Violet Gradient (Upright 'S') -->
    <linearGradient id="sFaceGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#ca8aff"/>
      <stop offset="30%" stop-color="#a855f7"/>
      <stop offset="70%" stop-color="#7c24e0"/>
      <stop offset="100%" stop-color="#550fb8"/>
    </linearGradient>

    <!-- 3D Extrusion Depth of 'S' (PlayStation Side Facets) -->
    <linearGradient id="sDepthGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#4a1290"/>
      <stop offset="100%" stop-color="#24054a"/>
    </linearGradient>

    <!-- PS Multi-Color Bands for Floor Diamond Rim -->
    <!-- Top-Right: Cyan -->
    <linearGradient id="bandCyan" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#00f2fe"/>
      <stop offset="100%" stop-color="#38bdf8"/>
    </linearGradient>
    <!-- Right-Bottom: Purple -->
    <linearGradient id="bandPurple" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#a855f7"/>
      <stop offset="100%" stop-color="#7c3aed"/>
    </linearGradient>
    <!-- Left-Bottom: Magenta -->
    <linearGradient id="bandMagenta" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f43f5e"/>
      <stop offset="100%" stop-color="#fb7185"/>
    </linearGradient>

    <!-- Ambient Canvas Glow -->
    <radialGradient id="ambientGlow" cx="50%" cy="55%" r="52%">
      <stop offset="0%" stop-color="#380e66" stop-opacity="0.5"/>
      <stop offset="60%" stop-color="#140726" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#090310" stop-opacity="0"/>
    </radialGradient>

    <!-- Drop Shadows for 3D Floating Presence -->
    <filter id="psEmblemShadow" x="-25%" y="-25%" width="150%" height="150%">
      <feDropShadow dx="0" dy="18" stdDeviation="20" flood-color="#000000" flood-opacity="0.85"/>
      <feDropShadow dx="0" dy="6" stdDeviation="12" flood-color="#7c3aed" flood-opacity="0.35"/>
    </filter>

    <filter id="playGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feDropShadow dx="0" dy="0" stdDeviation="6" flood-color="#ffffff" flood-opacity="0.7"/>
    </filter>
  </defs>

  <!-- ============================================== -->
  <!-- APP ICON CANVAS                                -->
  <!-- ============================================== -->
  <rect width="512" height="512" rx="116" fill="#090310"/>
  <rect width="512" height="512" rx="116" fill="url(#ambientGlow)"/>
  <rect width="510" height="510" x="1" y="1" rx="115" fill="none" stroke="#25123d" stroke-width="2"/>

  <!-- ============================================== -->
  <!-- PLAYSTATION PERSPECTIVE ARCHITECTURE           -->
  <!-- ============================================== -->
  <g filter="url(#psEmblemShadow)">

    <!-- ============================================ -->
    <!-- 1. FLOOR PLANE: STREMIO DIAMOND + PLAY SHADOW -->
    <!-- Explicit isometric floor geometry            -->
    <!-- Center: (268, 362)                           -->
    <!-- ============================================ -->

    <!-- Outer Diamond Band 1: Back-Left to Back-Right (Cyan) -->
    <!-- From Left (112, 362) to Top (268, 308) to Right (424, 362) -->
    <path d="M 112 362
             C 112 356, 120 350, 130 346
             L 254 304
             C 262 301, 274 301, 282 304
             L 406 346
             C 416 350, 424 356, 424 362
             L 388 362
             L 274 324
             C 270 322, 266 322, 262 324
             L 148 362 Z"
          fill="url(#bandCyan)"/>

    <!-- Outer Diamond Band 2: Back-Right to Front-Bottom (Purple / Magenta) -->
    <!-- From Right (424, 362) to Bottom (268, 416) -->
    <path d="M 424 362
             C 424 368, 416 374, 406 378
             L 282 420
             C 274 423, 262 423, 254 420
             L 264 398
             C 266 399, 270 399, 272 398
             L 388 362 Z"
          fill="url(#bandPurple)"/>

    <!-- Outer Diamond Band 3: Front-Bottom to Left (Magenta) -->
    <!-- From Bottom (268, 416) to Left (112, 362) -->
    <path d="M 254 420
             L 130 378
             C 120 374, 112 368, 112 362
             L 148 362
             L 264 398 Z"
          fill="url(#bandMagenta)"/>

    <!-- Floor Diamond Recessed Dark Well (Interior) -->
    <polygon points="144,362 268,322 392,362 268,402" fill="#0d0517"/>

    <!-- ============================================ -->
    <!-- THE PLAY TRIANGLE ON THE FLOOR (IN PERSPECTIVE) -->
    <!-- Pointing right in 3D floor projection        -->
    <!-- Perfectly clear, unobstructed, high contrast -->
    <!-- ============================================ -->
    <g filter="url(#playGlow)">
      <!-- Points: Base-Top (236, 348), Base-Bottom (254, 380), Tip (326, 364) -->
      <path d="M 238 347
               C 235 342, 241 338, 247 340
               L 322 360
               C 330 362, 330 368, 322 370
               L 259 385
               C 253 386, 247 382, 246 377 Z"
            fill="#ffffff"/>
    </g>

    <!-- ============================================ -->
    <!-- 2. UPRIGHT STANDING 'S' (STREMIO HERO LETTER) -->
    <!-- Exact PlayStation architectural silhouette   -->
    <!-- ============================================ -->

    <!-- 3D Extrusion Depth on Left/Spine (PS 'P' 3D bevel) -->
    <!-- Top-left loop depth -->
    <path d="M 174 154
             C 174 132, 186 114, 206 102
             L 190 90
             C 166 104, 152 128, 152 156
             L 152 216
             L 174 200 Z"
          fill="url(#sDepthGrad)"/>

    <!-- Bottom-left loop depth -->
    <path d="M 172 358
             L 150 372
             L 150 398
             C 168 418, 198 430, 234 430
             L 240 412
             C 212 412, 186 400, 172 384 Z"
          fill="url(#sDepthGrad)"/>

    <!-- Upright Master 'S' Body -->
    <path d="M 284 74
             C 206 74, 168 118, 168 166
             C 168 222, 228 240, 260 252
             C 298 268, 318 288, 318 322
             C 318 364, 278 396, 212 396
             C 164 396, 128 370, 114 344
             L 114 388
             C 138 414, 180 430, 226 430
             C 312 430, 362 380, 362 320
             C 362 258, 298 238, 264 224
             C 224 208, 210 190, 210 160
             C 210 124, 240 100, 286 100
             C 324 100, 352 120, 364 142
             L 364 98
             C 344 82, 316 74, 284 74 Z"
          fill="url(#sFaceGrad)"/>

    <!-- High-Gloss White Accent Along Upper Spine -->
    <path d="M 284 100
             C 240 100, 210 124, 210 160
             C 210 184, 222 202, 254 218"
          fill="none"
          stroke="#ffffff"
          stroke-width="3.5"
          stroke-linecap="round"
          opacity="0.7"/>
  </g>
</svg>