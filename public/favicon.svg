<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <defs>
    <style>
      polygon, polyline {
        shape-rendering: geometricPrecision;
      }
    </style>

    <!-- Top Tier Gradients -->
    <linearGradient id="gTopFace" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#f8f7fd"/>
    </linearGradient>

    <linearGradient id="gT1_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ffffff"/>
      <stop offset="100%" stop-color="#ece6f9"/>
    </linearGradient>
    <linearGradient id="gT1_L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#d1d2d6"/>
      <stop offset="100%" stop-color="#c6bbd9"/>
    </linearGradient>

    <linearGradient id="gT2_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#ebe0fe"/>
      <stop offset="100%" stop-color="#d8c9f5"/>
    </linearGradient>
    <linearGradient id="gT2_L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c6bbd9"/>
      <stop offset="100%" stop-color="#baadd2"/>
    </linearGradient>

    <!-- Middle Tier Gradients -->
    <linearGradient id="gMidFace" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#ebe0fe"/>
      <stop offset="100%" stop-color="#d2b0fa"/>
    </linearGradient>

    <linearGradient id="gM3_F" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#c49eed"/>
      <stop offset="100%" stop-color="#b383f6"/>
    </linearGradient>
    <linearGradient id="gM3_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#af74f5"/>
      <stop offset="100%" stop-color="#9e5fe8"/>
    </linearGradient>

    <linearGradient id="gM4_F" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#995be2"/>
      <stop offset="100%" stop-color="#8641d6"/>
    </linearGradient>
    <linearGradient id="gM4_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#8237d4"/>
      <stop offset="100%" stop-color="#6f22c4"/>
    </linearGradient>

    <!-- Bottom Tier Gradients -->
    <linearGradient id="gBotFace" x1="0%" y1="50%" x2="100%" y2="50%">
      <stop offset="0%" stop-color="#7a18cf"/>
      <stop offset="100%" stop-color="#6c12ba"/>
    </linearGradient>

    <linearGradient id="gB5_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#7a18cf"/>
      <stop offset="100%" stop-color="#5c0e9f"/>
    </linearGradient>
    <linearGradient id="gB5_L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#380b68"/>
      <stop offset="100%" stop-color="#2a0650"/>
    </linearGradient>

    <linearGradient id="gB6_R" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#4c098c"/>
      <stop offset="100%" stop-color="#320462"/>
    </linearGradient>
    <linearGradient id="gB6_L" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#220440"/>
      <stop offset="100%" stop-color="#140128"/>
    </linearGradient>
  </defs>

  <g id="stremio-isometric-s">
    <!-- ========================================================= -->
    <!-- 1. BOTTOM TIER (L-SHAPED BASE BLOCK)                     -->
    <!-- ========================================================= -->
    <!-- Band 6 (Lowest base, height = 109 to bottom apex 1626) -->
    <!-- Left wall (facing down-left) -->
    <polygon points="93.59,355.80 256.00,437.01 256.00,476.00 93.59,394.80" fill="url(#gB6_L)"/>
    <!-- Right wall (facing down-right) -->
    <polygon points="256.00,437.01 418.41,355.80 418.41,394.80 256.00,476.00" fill="url(#gB6_R)"/>
    <!-- Left arm end wall (facing down-left) -->
    <polygon points="166.57,319.32 93.59,355.80 93.59,394.80 166.57,358.31" fill="url(#gB6_L)"/>

    <!-- Band 5 (Upper base band, height = 89) -->
    <!-- Left wall (facing down-left) -->
    <polygon points="93.59,323.97 256.00,405.17 256.00,437.01 93.59,355.80" fill="url(#gB5_L)"/>
    <!-- Right wall (facing down-right) -->
    <polygon points="256.00,405.17 418.41,323.97 418.41,355.80 256.00,437.01" fill="url(#gB5_R)"/>
    <!-- Left arm end wall (facing down-left) -->
    <polygon points="166.57,287.48 93.59,323.97 93.59,355.80 166.57,319.32" fill="url(#gB5_L)"/>

    <!-- Bottom Tier Top Face (Pure parallel L-Shape) -->
    <polygon points="256.00,405.17 93.59,323.97 166.57,287.48 256.00,332.20 345.43,287.48 418.41,323.97" fill="url(#gBotFace)"/>

    <!-- ========================================================= -->
    <!-- 2. MIDDLE TIER (CLEAN CONTINUOUS RECTANGULAR BAR)        -->
    <!-- ========================================================= -->
    <!-- Middle Arm Band 4 (Lower band, height = 89) -->
    <polygon points="93.59,210.57 345.43,336.49 345.43,368.33 93.59,242.41" fill="url(#gM4_F)"/>
    <polygon points="345.43,336.49 418.41,300.00 418.41,331.84 345.43,368.33" fill="url(#gM4_R)"/>

    <!-- Middle Arm Band 3 (Upper band, height = 86) -->
    <polygon points="93.59,179.80 345.43,305.72 345.43,336.49 93.59,210.57" fill="url(#gM3_F)"/>
    <polygon points="345.43,305.72 418.41,269.24 418.41,300.00 345.43,336.49" fill="url(#gM3_R)"/>

    <!-- Middle Arm Top Face -->
    <polygon points="93.59,179.80 345.43,305.72 418.41,269.24 166.57,143.32" fill="url(#gMidFace)"/>

    <!-- Hair-line junction where middle arm meets bottom L top face -->
    <polygon points="345.43,368.33 418.41,331.84 418.41,332.55 345.43,369.04" fill="#5c0e9f"/>

    <!-- ========================================================= -->
    <!-- 3. TOP TIER (L-SHAPED UPPER BLOCK)                       -->
    <!-- ========================================================= -->
    <!-- Top Tier Band 2 (Lower band, height = 89) -->
    <polygon points="418.41,147.97 345.43,184.46 345.43,216.29 418.41,179.80" fill="url(#gT2_R)"/>
    <polygon points="345.43,184.46 256.00,139.74 256.00,171.58 345.43,216.29" fill="url(#gT2_L)"/>
    <polygon points="256.00,139.74 166.57,184.46 166.57,216.29 256.00,171.58" fill="url(#gT2_L)"/>
    <polygon points="166.57,184.46 93.59,147.97 93.59,179.80 166.57,216.29" fill="url(#gT2_R)"/>

    <!-- Top Tier Band 1 (Upper band, height = 86) -->
    <polygon points="418.41,117.20 345.43,153.69 345.43,184.46 418.41,147.97" fill="url(#gT1_R)"/>
    <polygon points="345.43,153.69 256.00,108.98 256.00,139.74 345.43,184.46" fill="url(#gT1_L)"/>
    <polygon points="256.00,108.98 166.57,153.69 166.57,184.46 256.00,139.74" fill="url(#gT1_L)"/>
    <polygon points="166.57,153.69 93.59,117.20 93.59,147.97 166.57,184.46" fill="url(#gT1_R)"/>

    <!-- Top Tier Top Face (Pure White) -->
    <polygon points="256.00,36.00 418.41,117.20 345.43,153.69 256.00,108.98 166.57,153.69 93.59,117.20" fill="url(#gTopFace)"/>

    <!-- Subtle edge highlight along the top outer crest -->
    <polyline points="93.59,117.20 256.00,36.00 418.41,117.20" fill="none" stroke="#ffffff" stroke-width="1.2" stroke-linecap="round"/>
  </g>
</svg>
